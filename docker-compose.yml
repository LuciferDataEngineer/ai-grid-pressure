services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-iceberg.sql:ro
  api:
    image: marquezproject/marquez:0.50.0
    depends_on:
      - db
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
  web:
    image: marquezproject/marquez-web:0.50.0
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      MARQUEZ_HOST: api
      MARQUEZ_PORT: "5000"
  trino:
    image: trinodb/trino:467
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - ./docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/node.properties:/etc/trino/node.properties:ro
      - ./docker/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./docker/trino/catalog:/etc/trino/catalog:ro
      - ${PWD}/data/warehouse:${PWD}/data/warehouse
